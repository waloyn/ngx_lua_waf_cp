# monitor：检测模式（仅记录日志不阻断），protection：防护模式，off：关闭waf
mode = "protection"
# debug
debug = "off"
# 是否信任反向代理转发头（X-Forwarded-For / X-Real-IP），直连部署请保持 off 防伪造
trust_proxy = "off"
# CDN模式：off / on（站点接入阿里ESA、Cloudflare等CDN时开启，优先通过CDN专属请求头获取真实客户端IP）
cdn_mode = "off"
# 自定义CDN真实IP请求头（可选，留空时按主流CDN优先级自动识别：Ali-CDN-Real-IP、CF-Connecting-IP、X-Forwarded-For等）
cdn_header = ""
# 受信任的CDN节点/代理IP列表或CIDR网段（可选，多个用逗号隔开；留空表示信任开启cdn_mode后的回源节点）
cdn_ips = ""
# waf日志文件路径
log_path = "e:/website/openresty/logs/waf"

# 置信度相关配置
possibly_timeout = 300    # 疑似攻击行为累计统计时间窗口（秒），默认5分钟
possibly_count   = 1      # 触发单次403拦截的置信度阈值（规则置信度：1低 / 2中 / 3高）

# 恶意行为与IP封禁相关配置
block_time       = 600    # 恶意攻击次数统计时间窗口（秒），默认10分钟
block_count      = 3      # 窗口内触发IP封禁的恶意攻击次数阈值
block_timeout    = 600    # 触发封禁后的IP基础禁止访问时长（秒），默认10分钟（连续封禁按倍数递增）


# 检测规则
exp_backup = "on"       # 开启备份路径检测规则
exp_bot = "on"          # 开启恶意机器人检测规则
exp_cmd = "on"          # 开启命令注入检测规则
exp_deserialize = "on"  # 开启反序列化攻击检测规则
exp_dns = "on"          # 开启DNS攻击检测规则
exp_ldap = "on"         # 开启LDAP注入检测规则
exp_nosql = "on"        # 开启NoSQL注入检测规则
exp_path = "on"         # 开启路径遍历检测规则
exp_sensitive = "on"    # 开启敏感信息检测规则
exp_spring = "on"       # 开启Spring Boot检测规则
exp_sqli = "on"         # 开启SQL注入检测规则
exp_ssrf = "on"         # 开启SSRF攻击检测规则
exp_ssti = "on"         # 开启SSTI模板注入检测规则
exp_upload = "on"       # 开启文件上传检测规则
exp_xss = "on"          # 开启跨站脚本攻击检测规则
exp_xxe = "on"          # 开启XML外部实体攻击检测规则

# 请求体最大是多少，单位是字节，默认是50M
body_max_size = 52428800
# 最大解码次数，默认是10次
decode_max_count = 10
# cc攻击拦截
cc_defence = "on"       # 开启CC攻击防护
cc_limit = 100          # CC攻击访问频率
cc_seconds = 30         # CC攻击时间窗口

# CC 人机挑战（行为特征检测 + JS挑战 / 5秒跳转 / 滑块 / 验证码）
cc_challenge = "auto"   # off=关闭挑战(保持429) / js / redirect / slider / captcha / auto=按触发次数逐级升级
cc_challenge_order = "js,redirect,slider,captcha"  # auto 模式的升级顺序
cc_challenge_ttl = 1800     # 通过挑战后的免验证时长（秒），0 起不生效
cc_challenge_delay = 5      # 5秒跳转挑战的等待时长（秒）
cc_challenge_pow = 3        # JS 挑战工作量证明难度（前导零十六进制位数，1~6）
cc_challenge_max_fail = 5   # 单个IP允许的挑战失败次数，达到后临时封禁
cc_challenge_fail_time = 600 # 挑战失败计数窗口与封禁时长（秒）
cc_challenge_issue_max = 20  # 单IP在失败窗口内最多下发挑战次数（防刷页耗尽共享字典）
cc_passed_factor = 6        # 已通过挑战的IP，CC阈值放大倍数（防止解题后无限刷）
challenge_secret = ""       # 挑战 Cookie 签名密钥（留空自动生成并存入共享字典）

# 行为特征检测
behavior_defence = "on"          # 行为特征检测总开关
behavior_window = 60             # 行为采样窗口（秒）
behavior_sample = 10             # 窗口内前 N 个请求只采样不判定，降低误伤
behavior_challenge_score = 6     # 风险分达到该值时下发人机挑战
behavior_block_score = 0         # 风险分达到该值时直接403（0=不启用，仅挑战）

# 统计功能
statistics = "on"       # 开启统计功能
