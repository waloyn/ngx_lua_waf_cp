<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统健康检查 - WAF 管理控制台</title>
    <script src="static/js/tailwind.min.js"></script>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-10">
    <div class="max-w-3xl mx-auto space-y-6">
        <!-- 头部 -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <div class="flex items-center gap-3">
                    <span class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    </span>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">WAF 系统自检与健康探测</h1>
                </div>
                <p class="text-xs text-slate-500 mt-1.5">实时探测核心后端接口联通性与响应格式规范</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                    返回后台
                </a>
                <button onclick="runChecks()" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>重新检测</span>
                </button>
            </div>
        </div>

        <!-- 检查列表 -->
        <div id="checks" class="space-y-3"></div>

        <!-- 总结汇报 -->
        <div id="summary" class="hidden bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h3 class="text-sm font-semibold text-slate-900 mb-2">检测汇总报告</h3>
            <div id="summaryText" class="text-xs text-slate-600"></div>
        </div>
    </div>

    <script>
        const checks = [
            { name: '仪表盘统计 API', url: '/api/stats', method: 'GET' },
            { name: '防护规则列表 API', url: '/api/rules', method: 'GET', validate: (data) => typeof data === 'object' },
            { name: 'IP黑名单文件 API', url: '/api/read-file?file=blackIp', method: 'GET' },
            { name: 'IP白名单文件 API', url: '/api/read-file?file=whiteIp', method: 'GET' },
            { name: 'Host白名单文件 API', url: '/api/read-file?file=whitehost', method: 'GET' },
            { name: '读取主配置 API', url: '/api/read-file?file=waf.conf', method: 'GET', validate: (data) => data.content !== undefined || typeof data === 'string' },
        ];

        async function runChecks() {
            const container = document.getElementById('checks');
            const summary = document.getElementById('summary');
            summary.classList.add('hidden');
            container.innerHTML = '';

            let passed = 0;
            let failed = 0;

            for (const check of checks) {
                const item = document.createElement('div');
                item.className = 'bg-white rounded-xl border border-slate-200 p-4 transition-all shadow-sm';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                            <span class="text-xs font-semibold text-slate-800">${check.name}</span>
                            <span class="text-[11px] font-mono text-slate-400">${check.url}</span>
                        </div>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-700">探测中...</span>
                    </div>
                `;
                container.appendChild(item);

                try {
                    const response = await fetch(check.url, { method: check.method });
                    const data = await response.json();

                    if (response.ok) {
                        const actualData = data.data !== undefined ? data.data : data;
                        if (check.validate && !check.validate(actualData)) {
                            throw new Error('数据结构校验不满足预期');
                        }

                        item.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                                    <span class="text-xs font-semibold text-slate-800">${check.name}</span>
                                    <span class="text-[11px] font-mono text-slate-400">${check.url}</span>
                                </div>
                                <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">正常响应 (HTTP 200)</span>
                            </div>
                            <div class="mt-2.5 pt-2.5 border-t border-slate-100 font-mono text-[11px] text-slate-500 max-h-24 overflow-y-auto bg-slate-50 p-2 rounded">
                                ${JSON.stringify(actualData, null, 2).substring(0, 400)}
                            </div>
                        `;
                        passed++;
                    } else {
                        throw new Error(`HTTP ${response.status}: ${data.data?.message || data.message || '未知异常'}`);
                    }
                } catch (error) {
                    item.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <span class="inline-block w-2 h-2 rounded-full bg-rose-500"></span>
                                <span class="text-xs font-semibold text-slate-800">${check.name}</span>
                                <span class="text-[11px] font-mono text-slate-400">${check.url}</span>
                            </div>
                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-rose-50 text-rose-700">异常未通过</span>
                        </div>
                        <div class="mt-2.5 pt-2.5 border-t border-slate-100 font-mono text-[11px] text-rose-600 bg-rose-50/50 p-2 rounded">
                            ${error.message}
                        </div>
                    `;
                    failed++;
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            summary.classList.remove('hidden');
            const summaryText = document.getElementById('summaryText');
            summaryText.innerHTML = `
                <div class="flex items-center gap-4 text-xs font-medium">
                    <span class="text-emerald-600">✓ 正常通过: ${passed} 项</span>
                    <span class="${failed > 0 ? 'text-rose-600 font-bold' : 'text-slate-400'}">✗ 异常失败: ${failed} 项</span>
                    <span class="text-slate-500">总探测项: ${checks.length} 项</span>
                </div>
                ${failed === 0 
                    ? '<p class="mt-2 text-emerald-700 font-medium">✨ 所有核心接口运行正常，管理控制台各项数据联动正常！</p>'
                    : '<p class="mt-2 text-rose-600">⚠️ 部分接口异常，请核验 OpenResty / WAF 服务配置或登录鉴权状态。</p>'
                }
            `;
        }

        // 页面打开时自动探测一次
        runChecks();
    </script>
</body>
</html>
